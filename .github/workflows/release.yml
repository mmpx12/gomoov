name: Release

on:
  push:
    tags:
      - "v1.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/gomoov-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/gomoov-linux-arm64 .
          make fetch-ffmpeg
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embedffmpeg -o dist/gomoov-linux-amd64-ffmpeg .

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
